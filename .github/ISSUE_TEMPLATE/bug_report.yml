name: Баг
description: Программа падает, теряет записи или ведёт себя странно
title: "[баг] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Чем точнее описание, тем быстрее получится повторить
        и починить.

  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: Опишите проблему и что вы ожидали увидеть.
      placeholder: После копирования ссылки запись не появляется в списке.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Шаги от запуска программы до ошибки.
      placeholder: |
        1. Запустить Клип
        2. Скопировать текст в блокноте
        3. Нажать Ctrl+Shift+V
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Windows 11
        - Windows 10
        - Другое
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия Клип
      description: Показывает окно «О программе» или имя файла из релиза.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Способ установки
      options:
        - Установщик Setup.exe
        - MSI
        - Портативный zip
        - Из исходников
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Сообщение об ошибке
      description: Если программа показала ошибку, вставьте текст целиком.
      render: text
