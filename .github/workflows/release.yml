name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Сборка
        run: |
          dotnet restore Klip.sln
          dotnet build Klip.sln -c Release --no-restore
          dotnet publish src/Klip/Klip.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o dist/app

      - name: Проверка exe
        run: |
          if (-not (Test-Path dist/app/Klip.exe)) { throw "Klip.exe не собран" }
          Get-Item dist/app/Klip.exe | Format-List Name, Length

      - name: Portable ZIP
        run: |
          Compress-Archive -Path dist/app/* -DestinationPath dist/Klip-Portable-win-x64.zip -Force

      - name: Inno Setup EXE
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\klip.iss

      - name: WiX MSI
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer/Klip.wxs -d PublishDir=dist/app -o dist/Klip-1.0.0-win-x64.msi -nologo

      - name: Контрольные суммы
        shell: bash
        run: |
          cd dist
          sha256sum Klip-Setup-1.0.0.exe Klip-1.0.0-win-x64.msi Klip-Portable-win-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/Klip-Setup-1.0.0.exe
            dist/Klip-1.0.0-win-x64.msi
            dist/Klip-Portable-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: публикация релиза
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Клип ${{ github.ref_name }}

            Личный буфер обмена и заметки для Windows 10/11.

            | Файл | Для чего |
            | --- | --- |
            | `Klip-Setup-1.0.0.exe` | Установщик Inno Setup — ярлыки, автозагрузка, русский мастер |
            | `Klip-1.0.0-win-x64.msi` | MSI для тихой установки и групповых политик |
            | `Klip-Portable-win-x64.zip` | Без установки, можно с флешки |
            | `SHA256SUMS.txt` | Контрольные суммы |

            Горячая клавиша после запуска: **Ctrl + Shift + V**.
