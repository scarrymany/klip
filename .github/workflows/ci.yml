name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: сборка
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore Klip.sln
      - run: dotnet build Klip.sln -c Release --no-restore
