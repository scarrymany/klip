name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: сборка
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Восстановление
        run: dotnet restore Klip.sln

      - name: Сборка
        run: dotnet build Klip.sln -c Release --no-restore

      - name: Тесты
        run: dotnet test Klip.sln -c Release --no-build --verbosity minimal
